name: Monthly Store & Policy Sync

# 毎月1日の午前9時（日本時間 / UTC 0:00）に定期実行
# およびGitHub管理画面から手動実行（workflow_dispatch）可能
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js環境のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 依存関係のインストール
        run: npm ci

      - name: 月次自動更新スクリプトの実行
        run: npm run update-stores

      - name: ビルドテスト（Vercelデプロイ前の整合性確認）
        run: npm run build

      - name: 変更があった場合の自動コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "差分なし: 更新データはありませんでした"
          else
            git commit -m "chore(data): 月次自動同期（公式産地ポリシー＆店舗更新） [skip ci]"
            git push origin HEAD:${{ github.ref }}
            echo "最新データをGitHubにプッシュしました（Vercelが自動再デプロイします）"
          fi
